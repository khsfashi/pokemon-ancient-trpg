<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" shape-rendering="crispEdges">
  <!-- Project-owned transparent keeper layer. Equipment/pose remains independent from environment. -->
  <g transform="translate(276 330)">
    <!-- head / wrapped cap -->
    <rect x="17" y="8" width="24" height="25" fill="#b88e66"/>
    <rect x="14" y="3" width="30" height="11" fill="#46372d"/>
    <rect x="11" y="11" width="36" height="7" fill="#554335"/>
    <rect x="36" y="19" width="6" height="5" fill="#6a4a37"/>
    <!-- torso -->
    <rect x="9" y="36" width="42" height="72" fill="#68523b"/>
    <rect x="13" y="42" width="34" height="58" fill="#7c6244"/>
    <g fill="#9b7950">
      <rect x="17" y="47" width="26" height="4"/><rect x="17" y="58" width="26" height="4"/>
      <rect x="17" y="69" width="26" height="4"/><rect x="17" y="80" width="26" height="4"/>
    </g>
    <g fill="#5a4735">
      <rect x="21" y="43" width="3" height="57"/><rect x="36" y="43" width="3" height="57"/>
    </g>
    <!-- arms, gloves -->
    <rect x="2" y="43" width="13" height="64" fill="#755b40"/>
    <rect x="45" y="43" width="13" height="64" fill="#755b40"/>
    <rect x="0" y="100" width="16" height="12" fill="#9e7756"/>
    <rect x="45" y="100" width="16" height="12" fill="#9e7756"/>
    <!-- belt / pouch -->
    <rect x="7" y="99" width="48" height="8" fill="#3e3027"/>
    <rect x="45" y="106" width="17" height="23" fill="#5c4430"/>
    <rect x="49" y="110" width="9" height="4" fill="#8c6b45"/>
    <!-- legs / boots -->
    <rect x="13" y="108" width="16" height="66" fill="#312e29"/>
    <rect x="34" y="108" width="16" height="66" fill="#2d2b27"/>
    <rect x="9" y="170" width="23" height="11" fill="#1f211f"/>
    <rect x="31" y="170" width="24" height="11" fill="#1f211f"/>
    <!-- work staff -->
    <rect x="67" y="14" width="5" height="188" fill="#493628"/>
    <rect x="63" y="12" width="13" height="7" fill="#6a5035"/>
    <rect x="65" y="2" width="9" height="10" fill="#7d613f"/>
    <!-- small knife sheath -->
    <rect x="5" y="106" width="6" height="34" fill="#493528"/>
    <rect x="3" y="105" width="10" height="6" fill="#9d8458"/>
  </g>
</svg>
