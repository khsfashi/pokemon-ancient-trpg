<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" shape-rendering="crispEdges">
  <!-- Project-owned transparent foreground occlusion layer. Can cover runtime characters. -->
  <!-- lower foliage banks -->
  <g fill="#1c2822">
    <rect x="0" y="618" width="94" height="226"/><rect x="296" y="596" width="94" height="248"/>
    <rect x="48" y="666" width="76" height="178"/><rect x="258" y="676" width="78" height="168"/>
  </g>
  <g fill="#2d3c2d">
    <rect x="8" y="574" width="18" height="166"/><rect x="38" y="610" width="16" height="138"/>
    <rect x="72" y="586" width="18" height="158"/><rect x="306" y="552" width="18" height="182"/>
    <rect x="338" y="588" width="16" height="150"/><rect x="366" y="560" width="16" height="176"/>
  </g>
  <g fill="#415139">
    <rect x="18" y="630" width="10" height="92"/><rect x="60" y="608" width="10" height="118"/>
    <rect x="102" y="662" width="9" height="72"/><rect x="280" y="670" width="9" height="66"/>
    <rect x="322" y="608" width="10" height="118"/><rect x="360" y="592" width="10" height="136"/>
  </g>
  <!-- branch crossing the encounter plane to prove z-depth -->
  <rect x="292" y="246" width="98" height="12" fill="#3b2e25"/>
  <rect x="320" y="226" width="70" height="9" fill="#3b2e25"/>
  <g fill="#26372b">
    <rect x="286" y="214" width="44" height="32"/><rect x="326" y="196" width="64" height="38"/>
    <rect x="306" y="250" width="50" height="26"/>
  </g>
  <g fill="#40523d">
    <rect x="296" y="204" width="22" height="8"/><rect x="342" y="188" width="28" height="8"/>
    <rect x="318" y="244" width="24" height="8"/>
  </g>
  <!-- grasses that can cut across lower silhouettes -->
  <g fill="#596347">
    <rect x="116" y="704" width="5" height="94"/><rect x="132" y="684" width="5" height="116"/>
    <rect x="246" y="690" width="5" height="110"/><rect x="266" y="712" width="5" height="88"/>
  </g>
  <!-- small airborne dust/light fragments; atmosphere remains separate from background. -->
  <g fill="#c3b27c" opacity="0.45">
    <rect x="72" y="330" width="3" height="3"/><rect x="104" y="286" width="3" height="3"/>
    <rect x="148" y="344" width="3" height="3"/><rect x="188" y="308" width="3" height="3"/>
    <rect x="244" y="282" width="3" height="3"/><rect x="286" y="324" width="3" height="3"/>
  </g>
</svg>
