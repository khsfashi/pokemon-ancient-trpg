<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" shape-rendering="crispEdges">
  <!-- Project-owned transparent foreground occlusion layer. Can cover runtime characters. -->
  <!-- lower foliage banks, stepped so silhouettes read as leaves instead of solid panels -->
  <g fill="#16211c">
    <rect x="0" y="640" width="52" height="204"/><rect x="338" y="620" width="52" height="224"/>
    <rect x="26" y="680" width="70" height="164"/><rect x="294" y="668" width="70" height="176"/>
  </g>
  <g fill="#223128">
    <rect x="0" y="608" width="28" height="84"/><rect x="16" y="590" width="38" height="72"/>
    <rect x="42" y="622" width="38" height="82"/><rect x="68" y="650" width="42" height="74"/>
    <rect x="282" y="650" width="42" height="74"/><rect x="310" y="608" width="38" height="90"/>
    <rect x="336" y="576" width="38" height="96"/><rect x="362" y="600" width="28" height="92"/>
  </g>
  <g fill="#314334">
    <rect x="6" y="594" width="18" height="12"/><rect x="25" y="576" width="24" height="13"/>
    <rect x="48" y="608" width="22" height="12"/><rect x="78" y="636" width="24" height="12"/>
    <rect x="286" y="636" width="24" height="12"/><rect x="316" y="594" width="22" height="12"/>
    <rect x="342" y="562" width="24" height="13"/><rect x="366" y="586" width="18" height="12"/>
  </g>
  <g fill="#465942">
    <rect x="12" y="588" width="8" height="5"/><rect x="34" y="570" width="9" height="5"/>
    <rect x="56" y="602" width="8" height="5"/><rect x="88" y="630" width="9" height="5"/>
    <rect x="294" y="630" width="9" height="5"/><rect x="324" y="588" width="8" height="5"/>
    <rect x="350" y="556" width="9" height="5"/><rect x="372" y="580" width="8" height="5"/>
  </g>

  <!-- branch crossing encounter plane: keeps Pokemon/runtime sprite visibly between depth layers -->
  <rect x="292" y="246" width="98" height="12" fill="#392c24"/>
  <rect x="320" y="226" width="70" height="9" fill="#392c24"/>
  <rect x="306" y="258" width="84" height="7" fill="#4b3828"/>
  <g fill="#1f3026">
    <rect x="282" y="214" width="34" height="38"/><rect x="300" y="198" width="42" height="42"/>
    <rect x="326" y="188" width="44" height="48"/><rect x="354" y="178" width="36" height="54"/>
    <rect x="306" y="244" width="44" height="34"/><rect x="344" y="236" width="46" height="36"/>
  </g>
  <g fill="#304535">
    <rect x="288" y="204" width="24" height="18"/><rect x="310" y="190" width="26" height="20"/>
    <rect x="334" y="178" width="28" height="20"/><rect x="362" y="170" width="28" height="20"/>
    <rect x="316" y="236" width="26" height="18"/><rect x="352" y="226" width="30" height="18"/>
  </g>
  <g fill="#4a6046">
    <rect x="296" y="198" width="10" height="5"/><rect x="320" y="184" width="11" height="5"/>
    <rect x="344" y="172" width="12" height="5"/><rect x="372" y="164" width="11" height="5"/>
    <rect x="324" y="230" width="10" height="5"/><rect x="362" y="220" width="11" height="5"/>
  </g>
  <g fill="#6b7556" opacity="0.45">
    <rect x="312" y="214" width="6" height="3"/><rect x="348" y="194" width="7" height="3"/>
    <rect x="372" y="206" width="6" height="3"/>
  </g>

  <!-- grasses that can cut across lower silhouettes -->
  <g fill="#526044">
    <rect x="112" y="704" width="5" height="96"/><rect x="128" y="682" width="5" height="120"/>
    <rect x="146" y="724" width="4" height="78"/><rect x="242" y="688" width="5" height="114"/>
    <rect x="262" y="710" width="5" height="92"/><rect x="278" y="730" width="4" height="72"/>
  </g>
  <g fill="#6f7a59">
    <rect x="116" y="742" width="12" height="3"/><rect x="132" y="722" width="12" height="3"/>
    <rect x="246" y="730" width="12" height="3"/><rect x="266" y="748" width="12" height="3"/>
  </g>

  <!-- small airborne dust/light fragments; atmosphere remains separate from background -->
  <g fill="#c3b27c" opacity="0.42">
    <rect x="72" y="330" width="3" height="3"/><rect x="104" y="286" width="3" height="3"/>
    <rect x="148" y="344" width="3" height="3"/><rect x="188" y="308" width="3" height="3"/>
    <rect x="244" y="282" width="3" height="3"/><rect x="286" y="324" width="3" height="3"/>
    <rect x="126" y="254" width="2" height="2"/><rect x="214" y="350" width="2" height="2"/>
  </g>
</svg>
