schema_version: p4-coverage-manifest-v1
mandatory_species_range: [1, 151]
resolution_rule: "resolved_record = status_defaults[dossier_status] merged with species row"

required_resolved_fields:
  - national_dex
  - species_key
  - dossier_status
  - source_review_status
  - stat_profile_status
  - capability_hazard_status
  - ecology_status
  - threat_encounter_status
  - individual_variation_status
  - bond_status
  - narrative_hook_status
  - p6_followup_required
  - blocking_gate_refs

status_defaults:
  not_started:
    source_review_status: not_started
    stat_profile_status: not_started
    capability_hazard_status: not_started
    ecology_status: not_started
    threat_encounter_status: not_started
    individual_variation_status: not_started
    bond_status: not_started
    narrative_hook_status: not_started
    p6_followup_required: unknown
    blocking_gate_refs: []
  draft:
    source_review_status: in_progress
    stat_profile_status: in_progress
    capability_hazard_status: in_progress
    ecology_status: in_progress
    threat_encounter_status: in_progress
    individual_variation_status: in_progress
    bond_status: in_progress
    narrative_hook_status: in_progress
    p6_followup_required: unknown
    blocking_gate_refs: []
  pilot_reviewed:
    source_review_status: complete
    stat_profile_status: complete
    capability_hazard_status: complete
    ecology_status: complete
    threat_encounter_status: complete
    individual_variation_status: complete
    bond_status: complete
    narrative_hook_status: complete
    blocking_gate_refs: []
  complete:
    source_review_status: complete
    stat_profile_status: complete
    capability_hazard_status: complete
    ecology_status: complete
    threat_encounter_status: complete
    individual_variation_status: complete
    bond_status: complete
    narrative_hook_status: complete
