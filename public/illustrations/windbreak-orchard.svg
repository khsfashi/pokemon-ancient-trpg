<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">방풍림 과수원 경계의 독침붕</title>
  <desc id="desc">고해상도 픽셀풍으로 그린 전근대 과수원 경계. 낡은 돌담과 목책, 천 경고표식, 과수원지기와 독침붕의 침 방향 및 비행 자세가 보인다.</desc>

  <!-- dusk sky: hard pixel bands, no smooth gradient -->
  <rect width="960" height="540" fill="#192319"/>
  <rect width="960" height="78" fill="#59654d"/>
  <rect y="78" width="960" height="66" fill="#6f7557"/>
  <rect y="144" width="960" height="64" fill="#8a8058"/>
  <rect y="208" width="960" height="52" fill="#a17e4e"/>
  <rect x="0" y="252" width="960" height="288" fill="#263326"/>

  <!-- distant blocky ridge / windbreak -->
