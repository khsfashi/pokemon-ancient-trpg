    <path d="M238 234h48v-36h54v18h42v88H226v-52h12z"/>
    <path d="M410 244h48v-42h60v24h42v86H398v-50h12z"/>
    <path d="M780 248h42v-36h54v24h42v78H768v-48h12z"/>
  </g>
  <g fill="#53643b">
