  <path fill="#1d2c22" d="M0 244h72v-24h48v12h54v-42h42v36h60v-18h48v30h66v-54h42v42h54v-30h48v36h72v-18h54v24h72v-48h48v36h60v-30h54v48h48v-18h60v94H0z"/>

