    <rect x="84" y="70" width="42" height="14" fill="#2c2920"/>
    <rect x="92" y="96" width="34" height="14" fill="#2c2920"/>
    <rect x="120" y="78" width="42" height="44" fill="#d7a934"/>
    <rect x="132" y="82" width="30" height="12" fill="#2b2820"/>
    <rect x="138" y="106" width="24" height="12" fill="#2b2820"/>

    <!-- abdominal stinger points toward route -->
    <path fill="#d8d2b7" d="M162 90h42v12h18v10h-18v10h-42z"/>
    <path fill="#5e5749" d="M204 102h36v8h-36z"/>

    <!-- forelimbs and long stingers -->
    <rect x="56" y="118" width="12" height="34" fill="#2d2c23"/>
    <rect x="22" y="144" width="44" height="12" fill="#2d2c23"/>
