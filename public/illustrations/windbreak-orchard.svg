    <path fill="#b9c4aa" d="M58 10h60v12h18v42h-18v12H70V64H52V28h6z"/>
    <path fill="#879983" d="M70 22h42v10h12v26h-12v8H78V56H64V32h6z"/>
    <path fill="#d0d5ba" d="M22 0h54v12h18v38H82v12H34V50H16V14h6z"/>
    <path fill="#98a68d" d="M32 12h34v8h14v24H68v8H40V42H28V20h4z"/>

    <!-- head and eyes -->
    <rect x="18" y="68" width="54" height="48" fill="#d7aa38"/>
    <rect x="12" y="78" width="12" height="28" fill="#a87b27"/>
    <rect x="66" y="78" width="12" height="28" fill="#a87b27"/>
    <rect x="22" y="80" width="18" height="22" fill="#9c302d"/>
    <rect x="50" y="80" width="18" height="22" fill="#9c302d"/>
