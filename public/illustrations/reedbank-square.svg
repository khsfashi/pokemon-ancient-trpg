<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">새벽의 리드뱅크 광장</title>
  <desc id="desc">강가 목조 정착지의 새벽 광장. 판자집, 지붕 이엉, 우물, 말뚝 선착장, 천막 좌판과 여행자들이 고해상도 픽셀풍으로 보인다.</desc>
