<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">뿔충이 흔적이 가로지르는 숲길</title>
  <desc id="desc">낡은 사람 길을 여러 마리 뿔충이의 먹이 흔적과 이동 자국이 가로지르는 숲 가장자리. 수피, 잘린 가지, 천 표식과 생태 흔적을 고해상도 픽셀풍으로 표현했다.</desc>
  <rect width="960" height="540" fill="#17281f"/>
  <rect width="960" height="72" fill="#374b3c"/><rect y="72" width="960" height="64" fill="#415944"/><rect y="136" width="960" height="70" fill="#4d6749"/><rect y="206" width="960" height="334" fill="#23382a"/>
