name: P8.2 Batch 04 Validation

on:
  pull_request:
    paths:
      - 'PROJECT_STATUS.md'
      - 'docs/P8_2_BATCH_04_AUDIT.md'
      - 'src/app/App.tsx'
      - 'src/app/NarrativeReveal.tsx'
      - 'src/app/motion.css'
      - 'src/main.tsx'
      - 'tests/p8-narrative-motion.test.ts'
      - 'e2e/p8-2-motion.spec.ts'
      - 'package.json'
      - '.github/workflows/p8-2-batch04-validation.yml'
  push:
    branches:
      - main
      - 'agent/**'
      - 'codex/**'
    paths:
      - 'PROJECT_STATUS.md'
      - 'docs/P8_2_BATCH_04_AUDIT.md'
      - 'src/app/App.tsx'
      - 'src/app/NarrativeReveal.tsx'
      - 'src/app/motion.css'
      - 'src/main.tsx'
      - 'tests/p8-narrative-motion.test.ts'
      - 'e2e/p8-2-motion.spec.ts'
      - 'package.json'
      - '.github/workflows/p8-2-batch04-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install from committed lockfile
        run: npm ci
      - name: Strict TypeScript integration check
        run: npm run typecheck
      - name: Deterministic unit fixtures
        run: npm run test
      - name: Static production PWA build
        run: npm run build
      - name: Install phone browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: P8.2 narrative motion safety in Chromium and WebKit
        run: npm run test:browser:p8-2-motion
      - name: Re-run inherited P8 phone smoke
        run: npm run test:browser:p8-smoke
      - name: Re-run P8 backup compatibility in Chromium and WebKit
        run: npm run test:browser:p8-save
