name: P8.2 Batch 06 Validation

on:
  pull_request:
    paths:
      - 'PROJECT_STATUS.md'
      - 'docs/P8_2_BATCH_06_AUDIT.md'
      - 'public/illustrations/**'
      - 'src/resources/p8Illustrations.ts'
      - 'src/app/NarrativeReveal.tsx'
      - 'src/app/SceneIllustration.tsx'
      - 'src/app/illustration.css'
      - 'src/main.tsx'
      - 'tests/p8-illustrations.test.ts'
      - 'e2e/p8-2-illustrations.spec.ts'
      - 'package.json'
      - '.github/workflows/p8-2-batch06-validation.yml'
  push:
    branches:
      - main
      - 'agent/**'
      - 'codex/**'
    paths:
      - 'PROJECT_STATUS.md'
      - 'docs/P8_2_BATCH_06_AUDIT.md'
      - 'public/illustrations/**'
      - 'src/resources/p8Illustrations.ts'
      - 'src/app/NarrativeReveal.tsx'
      - 'src/app/SceneIllustration.tsx'
      - 'src/app/illustration.css'
      - 'src/main.tsx'
      - 'tests/p8-illustrations.test.ts'
      - 'e2e/p8-2-illustrations.spec.ts'
      - 'package.json'
      - '.github/workflows/p8-2-batch06-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install from committed lockfile
        run: npm ci
      - name: Strict TypeScript integration check
        run: npm run typecheck
      - name: Deterministic unit fixtures
        run: npm run test
      - name: Static production PWA build
        run: npm run build
      - name: Install phone browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: P8.2 illustration and fallback acceptance
        run: npx playwright test e2e/p8-2-illustrations.spec.ts --project=phone-chromium --project=phone-webkit
      - name: Re-run inherited P8 phone smoke
        run: npm run test:browser:p8-smoke
      - name: Re-run P8 backup compatibility
        run: npm run test:browser:p8-save
