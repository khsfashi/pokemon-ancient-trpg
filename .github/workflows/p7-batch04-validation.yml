name: P7 Batch 04 Validation

on:
  pull_request:
    paths:
      - 'docs/P4_SPECIES_COVERAGE_MANIFEST.yaml'
      - 'docs/P5_*'
      - 'docs/P6_RESOURCE_MANIFEST.json'
      - 'src/generated/**'
      - 'tests/generated.runtime-pack.test.ts'
      - 'tools/build_p7_runtime_pack.py'
      - 'tools/validate_p5_contract.py'
      - 'tools/validate_p6_resources.py'
      - 'tools/requirements-p5-validation.txt'
      - 'tools/requirements-p6-validation.txt'
      - '.github/workflows/p7-batch04-validation.yml'
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'docs/P4_SPECIES_COVERAGE_MANIFEST.yaml'
      - 'docs/P5_*'
      - 'docs/P6_RESOURCE_MANIFEST.json'
      - 'src/generated/**'
      - 'tests/generated.runtime-pack.test.ts'
      - 'tools/build_p7_runtime_pack.py'
      - 'tools/validate_p5_contract.py'
      - 'tools/validate_p6_resources.py'
      - 'tools/requirements-p5-validation.txt'
      - 'tools/requirements-p6-validation.txt'
      - '.github/workflows/p7-batch04-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            tools/requirements-p5-validation.txt
            tools/requirements-p6-validation.txt
      - name: Install existing validator dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-p5-validation.txt -r tools/requirements-p6-validation.txt
      - name: Re-run frozen P5 validator before generation
        run: python tools/validate_p5_contract.py
      - name: Re-run frozen P6 validator before generation
        run: python tools/validate_p6_resources.py
      - name: Generate deterministic runtime pack
        run: python tools/build_p7_runtime_pack.py --output build/p7-runtime-pack.json
      - name: Bootstrap committed runtime pack on the agent branch
        if: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && hashFiles('src/generated/runtime-pack.json') == '' }}
        shell: bash
        run: |
          mkdir -p src/generated
          cp build/p7-runtime-pack.json src/generated/runtime-pack.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/generated/runtime-pack.json
          git commit -m 'Commit generated P7 runtime pack'
          git push
      - name: Require committed generated artifact when present
        shell: bash
        run: |
          if test -f src/generated/runtime-pack.json; then
            cmp -s src/generated/runtime-pack.json build/p7-runtime-pack.json || {
              echo 'Committed runtime pack is stale.'
              diff -u src/generated/runtime-pack.json build/p7-runtime-pack.json || true
              exit 1
            }
          else
            echo 'Bootstrap run: generated artifact will be committed by Batch 04.'
          fi
      - name: Upload normalized runtime-pack evidence
        uses: actions/upload-artifact@v4
        with:
          name: p7-runtime-pack
          path: build/p7-runtime-pack.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install from committed lockfile
        run: npm ci
      - name: Strict typecheck
        run: npm run typecheck
      - name: Deterministic unit fixtures
        run: npm run test
      - name: Static PWA production build
        run: npm run build
