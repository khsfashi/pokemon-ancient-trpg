name: Narrative Authoring Validation

on:
  pull_request:
    paths:
      - 'content/authoring/**'
      - 'tools/narrative_authoring.py'
      - 'docs/P8_3_*'
      - '.github/workflows/narrative-authoring-*.yml'
  push:
    branches: [main]
    paths:
      - 'content/authoring/**'
      - 'tools/narrative_authoring.py'
      - 'docs/P8_3_*'
      - '.github/workflows/narrative-authoring-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Compile orchestrator
        run: python -m py_compile tools/narrative_authoring.py
      - name: Validate persisted authoring artifacts
        run: python tools/narrative_authoring.py validate
      - name: Validate JSON schemas are parseable
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('content/authoring/schemas').glob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print('validated', path)
          PY
