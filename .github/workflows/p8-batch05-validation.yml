name: P8 Batch 05 Validation

on:
  pull_request:
    paths:
      - 'PROJECT_STATUS.md'
      - 'docs/P8_BATCH_05_AUDIT.md'
      - 'docs/P8_EXIT_AUDIT.md'
      - 'e2e/p8-exit.spec.ts'
      - 'e2e/p8-pwa-pending.spec.ts'
      - 'e2e/p8-save-compat.spec.ts'
      - 'playwright.p8-exit.config.ts'
      - 'playwright.p8-pwa.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/p8-batch05-validation.yml'
  push:
    branches:
      - main
      - 'agent/**'
      - 'codex/**'
    paths:
      - 'PROJECT_STATUS.md'
      - 'docs/P8_BATCH_05_AUDIT.md'
      - 'docs/P8_EXIT_AUDIT.md'
      - 'e2e/p8-exit.spec.ts'
      - 'e2e/p8-pwa-pending.spec.ts'
      - 'e2e/p8-save-compat.spec.ts'
      - 'playwright.p8-exit.config.ts'
      - 'playwright.p8-pwa.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/p8-batch05-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Re-run P8 vertical-slice contract guard
        run: python tools/validate_p8_vertical_slice.py
      - name: Re-run P8 authored pack guard
        run: python tools/check_p8_slice_pack.py
      - name: Re-run P8 phone presentation guard
        run: python tools/validate_p8_phone_presentation.py
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install from committed lockfile
        run: npm ci
      - name: Strict TypeScript integration check
        run: npm run typecheck
      - name: Deterministic unit fixtures
        run: npm run test
      - name: Static production PWA build
        run: npm run build
      - name: Install production phone browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: P8 backup compatibility in Chromium and WebKit
        run: npm run test:browser:p8-save
      - name: P8 production Chromium/WebKit full-run and check-reload proof
        run: npm run test:browser:p8-exit
      - name: P8 production PWA pending save with physical origin down
        run: npm run test:browser:p8-pwa
      - name: Re-run inherited P7 resource, save and PWA browser acceptance
        run: npm run test:e2e
