name: P6 Resource Validation

on:
  pull_request:
    paths:
      - 'docs/P6_*'
      - 'docs/RESOURCE_STRATEGY.md'
      - 'tools/validate_p6_resources.py'
      - 'tools/build_p6_production_import_manifest.py'
      - 'tools/requirements-p6-validation.txt'
      - '.github/workflows/p6-resource-validation.yml'
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'docs/P6_*'
      - 'docs/RESOURCE_STRATEGY.md'
      - 'tools/validate_p6_resources.py'
      - 'tools/build_p6_production_import_manifest.py'
      - 'tools/requirements-p6-validation.txt'
      - '.github/workflows/p6-resource-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/requirements-p6-validation.txt
      - name: Install P6 validator dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-p6-validation.txt
      - name: Validate frozen P6 manifest, provenance policy, and budgets
        run: python tools/validate_p6_resources.py
      - name: Self-test production importer without network
        run: python tools/build_p6_production_import_manifest.py --self-test
      - name: Validate pinned Gen-I production import and materialize SHA-256 metadata
        run: python tools/build_p6_production_import_manifest.py --animated-ids all --output build/p6-production-import-manifest.json
      - name: Validate produced metadata-only import manifest
        run: python tools/validate_p6_resources.py --production-import-manifest build/p6-production-import-manifest.json
      - name: Upload metadata-only P6 import evidence
        uses: actions/upload-artifact@v4
        with:
          name: p6-production-import-manifest
          path: build/p6-production-import-manifest.json
          if-no-files-found: error
          retention-days: 14
