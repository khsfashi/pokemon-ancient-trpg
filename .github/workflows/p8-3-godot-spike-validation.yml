name: P8.3 Godot Spike Validation

on:
  pull_request:
    paths:
      - 'godot/**'
      - 'docs/P8_3_GODOT_ARCHITECTURE_SPIKE.md'
      - 'PROJECT_STATUS.md'
      - '.github/workflows/p8-3-godot-spike-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p8-3-godot-spike-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.6.3'
  GODOT_ARCHIVE: 'Godot_v4.6.3-stable_linux.x86_64.zip'

jobs:
  godot-spike:
    name: Godot 4.6.3 parity + boot smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare retained runtime logs
        shell: bash
        run: mkdir -p test-results/godot-spike

      - name: Install and verify pinned official Godot build
        shell: bash
        run: |
          set -euo pipefail
          {
            release_tag="${GODOT_VERSION}-stable"
            base_url="https://github.com/godotengine/godot-builds/releases/download/${release_tag}"
            metadata_url="https://api.github.com/repos/godotengine/godot-builds/releases/tags/${release_tag}"
            mkdir -p "$RUNNER_TEMP/godot"
            cd "$RUNNER_TEMP/godot"

            curl --fail --location --retry 3 --output "$GODOT_ARCHIVE" "$base_url/$GODOT_ARCHIVE"
            curl --fail --location --retry 3 \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --output release.json \
              "$metadata_url"

            expected_sha="$(python3 - "$GODOT_ARCHIVE" <<'PY'
          import json
          import sys

          asset_name = sys.argv[1]
          with open("release.json", encoding="utf-8") as handle:
              release = json.load(handle)

          for asset in release.get("assets", []):
              if asset.get("name") != asset_name:
                  continue
              digest = asset.get("digest") or ""
              if not digest.startswith("sha256:"):
                  raise SystemExit(f"missing sha256 digest metadata for {asset_name}")
              print(digest.split(":", 1)[1])
              break
          else:
              raise SystemExit(f"release asset not found: {asset_name}")
          PY
            )"
            actual_sha="$(sha256sum "$GODOT_ARCHIVE" | awk '{print $1}')"
            printf 'Godot archive sha256 expected=%s actual=%s\n' "$expected_sha" "$actual_sha"
            test "$actual_sha" = "$expected_sha"

            unzip -q "$GODOT_ARCHIVE"
            chmod +x "${GODOT_ARCHIVE%.zip}"
            ln -s "$RUNNER_TEMP/godot/${GODOT_ARCHIVE%.zip}" "$RUNNER_TEMP/godot/godot"
            echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
            "$RUNNER_TEMP/godot/godot" --version
          } 2>&1 | tee "$GITHUB_WORKSPACE/test-results/godot-spike/install.log"

      - name: Boot bounded owner-review scene
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path godot --quit-after 2 2>&1 | tee test-results/godot-spike/main-scene-boot.log

      - name: Run deterministic parity and save smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path godot --script res://tests/parity_smoke.gd 2>&1 | tee test-results/godot-spike/parity-smoke.log
          grep -F 'P8.3 Godot parity smoke: PASS' test-results/godot-spike/parity-smoke.log

      - name: Upload Godot spike logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8-3-godot-spike-runtime-logs
          path: test-results/godot-spike
          if-no-files-found: error
          retention-days: 14
