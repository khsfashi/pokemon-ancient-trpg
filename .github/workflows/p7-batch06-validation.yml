name: P7 Batch 06 Validation

on:
  pull_request:
    paths:
      - 'package.json'
      - 'playwright.config.ts'
      - 'playwright.pwa.config.ts'
      - 'vercel.json'
      - 'src/main.tsx'
      - 'src/platform/serviceWorker.ts'
      - 'src/saves/**'
      - 'tests/saves.*'
      - 'e2e/browser-save.spec.ts'
      - 'e2e/pwa-offline.spec.ts'
      - 'e2e/resource-cache.spec.ts'
      - 'tools/build-service-worker.mjs'
      - 'tools/validate-dist.mjs'
      - 'tools/validate-static-deployment.mjs'
      - 'docs/P7_BATCH_06_AUDIT.md'
      - 'docs/P7_EXIT_AUDIT.md'
      - 'PROJECT_STATUS.md'
      - '.github/workflows/p7-batch06-validation.yml'
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'package.json'
      - 'playwright.config.ts'
      - 'playwright.pwa.config.ts'
      - 'vercel.json'
      - 'src/main.tsx'
      - 'src/platform/serviceWorker.ts'
      - 'src/saves/**'
      - 'tests/saves.*'
      - 'e2e/browser-save.spec.ts'
      - 'e2e/pwa-offline.spec.ts'
      - 'e2e/resource-cache.spec.ts'
      - 'tools/build-service-worker.mjs'
      - 'tools/validate-dist.mjs'
      - 'tools/validate-static-deployment.mjs'
      - 'docs/P7_BATCH_06_AUDIT.md'
      - 'docs/P7_EXIT_AUDIT.md'
      - 'PROJECT_STATUS.md'
      - '.github/workflows/p7-batch06-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install from committed lockfile
        run: npm ci
      - name: Strict typecheck
        run: npm run typecheck
      - name: Deterministic unit fixtures
        run: npm run test
      - name: Static production PWA build
        run: npm run build
      - name: Install phone browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Phone Chromium/WebKit Batch 06 acceptance
        run: npm run test:e2e
